name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_compliance_gateway
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      VAULT_MASTER_KEY: ZGV2LW9ubHktdmF1bHQta2V5LTMyLWJ5dGVzLS0tLS0tLQ==
      AUDIT_USER_SALT: ci-salt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:packages
      - run: pnpm typecheck
      - run: pnpm db:create && pnpm db:migrate && pnpm db:seed
      - run: pnpm test
      - name: Audit des dépendances
        run: pnpm audit --audit-level high
